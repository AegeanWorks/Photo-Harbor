  <text x="152" y="224" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="700" fill="#c084fc">PH</text>
  <text x="300" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="700" fill="#e2f8ff">Photo-Harbor</text>
  <text x="300" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="34" fill="#e2f8ff" fill-opacity="0.78">Self-hosted photo server for Windows: an iPhone</text><text x="300" y="298" font-family="Segoe UI, Arial, sans-serif" font-size="34" fill="#e2f8ff" fill-opacity="0.78">sends new photos over home Wi-Fi through Apple</text><text x="300" y="346" font-family="Segoe UI, Arial, sans-serif" font-size="34" fill="#e2f8ff" fill-opacity="0.78">Shortcuts, no app needed, with a verified-hash</text>
  <text x="64" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="22" letter-spacing="6" fill="#e2f8ff" fill-opacity="0.55">AEGEANWORKS · WEB</text>
